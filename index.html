<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold Sphere Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    :root {
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --speed: 450ms;
    }
    html[data-theme="dark"] {
      --bg: #121212; --stage: #1a1a1a; --panel: #1e1e1e; --border: #2e2e2e;
      --text: #e0e0e0; --muted: #888; --accent: #d4a53c; --chip: #262626;
    }
    html[data-theme="light"] {
      --bg: #e5e5e5; --stage: #f2f2f2; --panel: #f7f7f7; --border: #cfcfcf;
      --text: #1d1d1d; --muted: #666; --accent: #a8741a; --chip: #e9e9e9;
    }
    html[data-theme="cyber"] {
      --bg: #050b14; --stage: #0a1424; --panel: #0c1829; --border: #16304f;
      --text: #d6e7ff; --muted: #6f8bb0; --accent: #36d6ff; --chip: #102340;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: background-color var(--speed) var(--ease), color var(--speed) var(--ease);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 0;
    }
    .container {
      width: min(1100px, calc(100% - 32px));
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 20px;
    }
    header { grid-column: 1 / -1; }
    h1 {
      font-weight: 500;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
      margin: 0;
    }
    header p { margin: 4px 0 0; }
    model-viewer {
      width: 100%;
      height: 600px;
      background: var(--stage);
      border-radius: 12px;
      border: 1px solid var(--border);
      --poster-color: transparent;
      transition: background-color var(--speed) var(--ease), border-color var(--speed) var(--ease);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: background-color var(--speed) var(--ease), border-color var(--speed) var(--ease);
    }
    h2 {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .options { display: flex; flex-direction: column; gap: 6px; }
    .options.grid { display: grid; grid-template-columns: 1fr 1fr; }
    button {
      font: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      transition: background-color var(--speed) var(--ease), border-color 200ms var(--ease),
                  color var(--speed) var(--ease), transform 150ms var(--ease);
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button[aria-pressed="true"] {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex: none;
      border: 1px solid rgba(128, 128, 128, 0.4);
    }
    label.row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .hint, header p {
      color: var(--muted);
      font-size: 0.85rem;
      transition: color var(--speed) var(--ease);
    }
    .hint { margin: 10px 0 0; text-align: center; }
    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; }
      model-viewer { height: 60vh; min-height: 340px; }
      .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      :root { --speed: 0ms; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gold Sphere</h1>
      <p>Cycles-baked brushed normal map &middot; real-time PBR in the browser</p>
    </header>

    <div>
      <model-viewer
        id="viewer"
        src="Gold_Sphere_Interactive.glb"
        alt="Brushed gold sphere"
        auto-rotate
        camera-controls
        interpolation-decay="120"
        camera-orbit="35deg 70deg 5.5m"
        field-of-view="30deg"
        min-camera-orbit="auto 0deg 1.4m"
        max-camera-orbit="auto 180deg 8m"
        min-field-of-view="10deg"
        shadow-intensity="1.5"
        exposure="1"
        environment-image="neutral">
      </model-viewer>
      <p class="hint">Drag to orbit &middot; scroll to zoom</p>
    </div>

    <aside class="panel">
      <section>
        <h2>Camera</h2>
        <div class="options" data-group="camera">
          <button type="button" aria-pressed="true" data-orbit="35deg 70deg 5.5m" data-fov="30deg">Hero View</button>
          <button type="button" aria-pressed="false" data-orbit="0deg 15deg 4.5m" data-fov="30deg">Top-Down 75&deg;</button>
          <button type="button" aria-pressed="false" data-orbit="20deg 80deg 1.6m" data-fov="18deg">Macro Close-Up</button>
        </div>
      </section>

      <section>
        <h2>Material</h2>
        <div class="options grid" data-group="material">
          <button type="button" aria-pressed="true" data-color="1,0.65,0.05" data-rough="0.18">
            <span class="dot" style="background:#f2c14e"></span>Brushed Gold</button>
          <button type="button" aria-pressed="false" data-color="0.85,0.48,0.38" data-rough="0.22">
            <span class="dot" style="background:#e8b4a0"></span>Rose Gold</button>
          <button type="button" aria-pressed="false" data-color="0.11,0.11,0.12" data-rough="0.35">
            <span class="dot" style="background:#3a3b3e"></span>Dark Titanium</button>
          <button type="button" aria-pressed="false" data-color="0.97,0.97,0.97" data-rough="0.02">
            <span class="dot" style="background:linear-gradient(135deg,#fff,#9aa0a6)"></span>Chrome Mirror</button>
        </div>
      </section>

      <section>
        <h2>HDR Lighting</h2>
        <div class="options grid" data-group="environment">
          <button type="button" aria-pressed="true" data-env="neutral">Neutral</button>
          <button type="button" aria-pressed="false" data-env="legacy">Legacy</button>
        </div>
        <div style="margin-top:12px">
          <label class="row" for="exposure"><span>Exposure</span><span id="exposure-value">1.00</span></label>
          <input id="exposure" type="range" min="0.3" max="2" step="0.05" value="1">
        </div>
      </section>

      <section>
        <h2>Canvas Theme</h2>
        <div class="options" data-group="theme">
          <button type="button" aria-pressed="true" data-theme="dark">
            <span class="dot" style="background:#121212"></span>Dark Studio</button>
          <button type="button" aria-pressed="false" data-theme="light">
            <span class="dot" style="background:#e5e5e5"></span>Light Studio</button>
          <button type="button" aria-pressed="false" data-theme="cyber">
            <span class="dot" style="background:#050b14"></span>Cyber Midnight</button>
        </div>
      </section>
    </aside>
  </div>

  <script type="module">
    const viewer = document.getElementById('viewer');
    const exposure = document.getElementById('exposure');
    const exposureValue = document.getElementById('exposure-value');

    const actions = {
      camera(btn) {
        viewer.autoRotate = false;
        viewer.cameraOrbit = btn.dataset.orbit;
        viewer.fieldOfView = btn.dataset.fov;
      },
      material(btn) {
        const material = viewer.model?.materials[0];
        if (!material) return;
        const pbr = material.pbrMetallicRoughness;
        pbr.setBaseColorFactor([...btn.dataset.color.split(',').map(Number), 1]);
        pbr.setMetallicFactor(1);
        pbr.setRoughnessFactor(Number(btn.dataset.rough));
      },
      environment(btn) {
        viewer.environmentImage = btn.dataset.env;
      },
      theme(btn) {
        document.documentElement.dataset.theme = btn.dataset.theme;
      },
    };

    document.querySelectorAll('[data-group]').forEach(group => {
      group.addEventListener('click', event => {
        const btn = event.target.closest('button');
        if (!btn) return;
        group.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
        actions[group.dataset.group](btn);
      });
    });

    exposure.addEventListener('input', () => {
      viewer.exposure = Number(exposure.value);
      exposureValue.textContent = Number(exposure.value).toFixed(2);
    });
  </script>
</body>
</html>
